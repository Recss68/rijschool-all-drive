name: CI

# Runs on every PR to main/dev and on every push to main/dev.
# Deployments are done by Vercel's Git integration (preview per PR, production on main);
# see deploy-check.yml for the post-deploy checks on production.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# A new push cancels the running checks of the same PR or branch
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npx eslint .

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Builds the site and runs the integration tests against `vite preview`
      - name: Vitest
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Reports known vulnerabilities as a warning and in the run summary without failing the PR;
      # Dependabot opens the update PRs
      - name: npm audit (production dependencies)
        run: |
          if npm audit --omit=dev --audit-level=high > audit.txt; then
            echo 'No high or critical vulnerabilities in production dependencies.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=npm audit::$(tail -n 3 audit.txt | head -n 1)"
            {
              echo '### npm audit (production dependencies)'
              echo '```'
              cat audit.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
