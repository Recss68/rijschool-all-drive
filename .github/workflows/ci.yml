name: CI

# Runs on every PR to main/dev and on every push to main/dev.
# Deployments are done by Vercel's Git integration (preview per PR, production on main);
# see deploy-check.yml for the post-deploy checks on production.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# A new push cancels the running checks of the same PR or branch
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npx eslint .

  test:
    name: Tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Builds the site and runs the integration tests against `vite preview`
      - name: Vitest
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reports known vulnerabilities without blocking; Dependabot opens the fix PRs
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (production dependencies)
        run: |
          {
            echo '### npm audit (production dependencies)'
            echo '```'
            npm audit --omit=dev --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=high
